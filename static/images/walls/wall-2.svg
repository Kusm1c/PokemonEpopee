<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Generic wall, 2 square(s) long. White, so that the system can tint it per wall. -->
  <defs>
    <pattern id="lattice" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H28M0 0V28" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect x="10" y="62" width="380" height="76" rx="18" fill="url(#body)"/>
  <rect x="10" y="62" width="380" height="76" rx="18" fill="url(#lattice)"/>
  <line x1="200" y1="70" x2="200" y2="130" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
  <rect x="10" y="62" width="380" height="76" rx="18" fill="none" stroke="#ffffff" stroke-width="7"/>
</svg>
